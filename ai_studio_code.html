import cz.betareader.app.ui.reader.ReaderScreen

class MainActivity : ComponentActivity() {
    private val libraryViewModel: LibraryViewModel by viewModels()
    private val readerViewModel: ReaderViewModel by viewModels()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        intent?.data?.let { uri ->
            try {
                contentResolver.takePersistableUriPermission(
                    uri,
                    Intent.FLAG_GRANT_READ_URI_PERMISSION
                )
                libraryViewModel.addDocumentFromUri(uri)
            } catch (e: Exception) {
                e.printStackTrace()
            }
        }

        setContent {
            BetaReaderTheme {
                var activeDocument by remember { mutableStateOf<DocumentEntity?>(null) }
                if (activeDocument == null) {
                    LibraryScreen(
                        viewModel = libraryViewModel,
                        onOpenDocument = { doc -> activeDocument = doc }
                    )
                } else {
                    ReaderScreen(
                        document = activeDocument!!,
                        viewModel = readerViewModel,
                        onBack = { activeDocument = null }
                    )
                }
            }
        }
    }
}

import android.content.Context
import android.net.Uri
import org.xmlpull.v1.XmlPullParser
import org.xmlpull.v1.XmlPullParserFactory
import java.io.BufferedReader
import java.io.InputStream
import java.util.zip.ZipInputStream

object DocumentEngine {
    fun extractContent(context: Context, uri: Uri, type: DocumentType): String {
        return context.contentResolver.openInputStream(uri)?.use { stream ->
            when (type) {
                DocumentType.TXT -> stream.bufferedReader(Charsets.UTF_8).use(BufferedReader::readText)
                DocumentType.DOCX -> readDocxText(stream)
                DocumentType.ODT -> readOdtText(stream)
                DocumentType.EPUB -> readEpubText(stream)
                DocumentType.RTF -> readRtfText(stream)
                DocumentType.PDF -> "PDF_NATIVE_RENDERER"
                DocumentType.UNKNOWN -> stream.bufferedReader(Charsets.UTF_8).use(BufferedReader::readText)
            }
        } ?: "Nelze načíst soubor."
    }

    private fun readDocxText(stream: InputStream): String {
        val sb = StringBuilder()
        ZipInputStream(stream).use { zip ->
            var entry = zip.nextEntry
            while (entry != null) {
                if (entry.name == "word/document.xml") {
                    parseXmlStream(zip, sb, listOf("w:t", "t"), listOf("w:p", "p"))
                    break
                }
                zip.closeEntry()
                entry = zip.nextEntry
            }
        }
        return sb.toString().ifEmpty { "Dokument DOCX neobsahuje čitelný text." }
    }

    private fun readOdtText(stream: InputStream): String {
        val sb = StringBuilder()
        ZipInputStream(stream).use { zip ->
            var entry = zip.nextEntry
            while (entry != null) {
                if (entry.name == "content.xml") {
                    parseXmlStream(zip, sb, listOf("text:p", "text:span"), listOf("text:p"))
                    break
                }
                zip.closeEntry()
                entry = zip.nextEntry
            }
        }
        return sb.toString().ifEmpty { "Dokument ODT neobsahuje čitelný text." }
    }

    private fun readEpubText(stream: InputStream): String {
        val sb = StringBuilder()
        ZipInputStream(stream).use { zip ->
            var entry = zip.nextEntry
            while (entry != null) {
                if (entry.name.endsWith(".xhtml", true) || entry.name.endsWith(".html", true)) {
                    val content = zip.bufferedReader().readText()
                    val cleanText = content.replace(Regex("<br\\\\s*/?>"), "\\n")
                        .replace(Regex("</p>"), "\\n\\n")
                        .replace(Regex("<[^>]*>"), "")
                        .replace("&nbsp;", " ")
                        .replace("&quot;", "\\"")
                        .replace("&amp;", "&")
                    sb.append(cleanText).append("\\n\\n")
                }
                zip.closeEntry()
                entry = zip.nextEntry
            }
        }
        return sb.toString().ifEmpty { "EPUB soubor neobsahuje čitelný obsah." }
    }

    private fun readRtfText(stream: InputStream): String {
        val text = stream.bufferedReader().readText()
        return text.replace(Regex("\\\\[a-z]+-?[0-9]* ?"), "").replace(Regex("[{}]"), "").trim()
    }

    private fun parseXmlStream(stream: InputStream, sb: StringBuilder, textTags: List<String>, paragraphTags: List<String>) {
        val factory = XmlPullParserFactory.newInstance()
        factory.isNamespaceAware = false
        val parser = factory.newPullParser()
        parser.setInput(stream, "UTF-8")
        var eventType = parser.eventType
        while (eventType != XmlPullParser.END_DOCUMENT) {
            when (eventType) {
                XmlPullParser.START_TAG -> {
                    if (parser.name in paragraphTags && sb.isNotEmpty() && !sb.endsWith("\\n\\n")) {
                        sb.append("\\n\\n")
                    }
                }
                XmlPullParser.TEXT -> sb.append(parser.text)
            }
            eventType = parser.next()
        }
    }
}
