<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7d9cc"><title>Moje beta čtení</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><b>✦</b><div><h1>Moje beta čtení</h1><p>Rukopisy, zvýraznění a poznámky</p></div></header><main><label class="open">＋ Otevřít rukopis <input id="file" type="file" accept=".txt,.rtf,.docx,.odt,.epub,.pdf"></label><button id="export">Export poznámek</button><p id="status">Vyber rukopis ve formátu PDF, DOCX, EPUB, ODT, RTF nebo TXT.</p><div class="layout"><aside><h3>Moje rukopisy</h3><div id="library">Zatím žádný rukopis.</div></aside><section><h2 id="title">Otevři rukopis</h2><div class="actions"><button id="highlight">Zvýraznit</button><button id="comment">＋ Přidat poznámku</button></div><article id="reader">Text rukopisu se zobrazí zde. Označ část textu a přidej poznámku.</article></section><aside><h3>Poznámky</h3><div id="notes">Zatím žádné poznámky.</div></aside></div></main><dialog id="dlg"><form id="form" method="dialog"><h2>Poznámka k označenému textu</h2><blockquote id="quote"></blockquote><textarea id="commentText" placeholder="Tvoje poznámka…" rows="5"></textarea><label>Barva <select id="color"><option value="yellow">Žlutá</option><option value="pink">Růžová</option><option value="blue">Modrá</option><option value="green">Zelená</option><option value="purple">Fialová</option></select></label><p><button value="cancel">Zrušit</button><button id="save" value="default">Uložit</button></p></form></dialog><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="app.js"></script></body></html>
